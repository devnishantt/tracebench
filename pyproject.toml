[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tracebench"
version = "0.1.0"
description = "Local-first dataset contracts, quality checks, and reproducible drift reports"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.3,<2", "pydantic>=2.11,<3", "typer>=0.16,<1", "rich>=13,<15", "jinja2>=3.1.6,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1", "mypy>=1.16,<2", "build>=1.2,<2"]

[project.scripts]
tracebench = "tracebench.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/tracebench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["src/tracebench"]
check_untyped_defs = true
ignore_missing_imports = true

