name: Tracebench checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: mypy src/tracebench
      - run: pytest --cov=tracebench --cov-report=term-missing
      - run: python -m build
      - run: tracebench check examples/orders-baseline.csv -c examples/orders.contract.json
